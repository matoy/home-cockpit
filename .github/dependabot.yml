version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # eslint-config-next@16 deps (eslint-plugin-react/import/jsx-a11y) cap peer eslint at ^9
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # typescript-eslint@8 declares peer typescript <6.1.0
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      nextjs:
        patterns:
          - "next"
          - "eslint-config-next"
      tailwindcss:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/postcss"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "react-is"
          - "@types/react"
          - "@types/react-dom"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
