version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # eslint-config-next@15 declares peer eslint "^7.23.0 || ^8.0.0 || ^9.0.0"
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # eslint-config-next@16 switches to native flat config (breaks FlatCompat) and targets Next 16
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      # Next.js 16 requires a deliberate migration alongside eslint-config-next@16
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      # Tailwind CSS v4 requires migrating PostCSS to @tailwindcss/postcss and CSS directives
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
    groups:
      nextjs:
        patterns:
          - "next"
          - "eslint-config-next"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "react-is"
          - "@types/react"
          - "@types/react-dom"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
