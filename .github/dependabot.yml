version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # eslint-config-next@15 declares peer eslint "^7.23.0 || ^8.0.0 || ^9.0.0"
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    groups:
      nextjs:
        patterns:
          - "next"
          - "eslint-config-next"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
